<div class="profile-page">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>My Profile</h1>
      <p>Manage your personal information</p>
    </div>

    <button
      *ngIf="!isEditing"
      class="edit-btn"
      (click)="editProfile()">
      <i class="fa-solid fa-pen"></i>
      Edit Profile
    </button>
  </div>


  <!-- =========================
       PERSONAL INFORMATION
  ========================== -->

  <div class="profile-card">

    <!-- Profile Header -->
    <div class="profile-header">

      <div class="profile-avatar">
        {{ getInitials() }}
      </div>

      <div>
        <h2>{{ user.fullName }}</h2>
        <p>{{ user.email }}</p>
      </div>

    </div>


    <!-- Personal Information -->
    <div class="section">

      <h3>Personal Information</h3>

      <div class="form-grid">

        <!-- Full Name -->
        <div class="form-group">
          <label>Full Name</label>

          <input
            type="text"
            [(ngModel)]="user.fullName"
            [disabled]="!isEditing">
        </div>


        <!-- Email -->
        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            [(ngModel)]="user.email"
            disabled>
        </div>


        <!-- Phone -->
        <div class="form-group">
          <label>Phone Number</label>

          <input
            type="text"
            [(ngModel)]="user.phoneNumber"
            [disabled]="!isEditing">
        </div>


        <!-- Date of Birth -->
        <div class="form-group">
          <label>Date of Birth</label>

          <input
            type="date"
            [(ngModel)]="user.dateOfBirth"
            [disabled]="!isEditing">
        </div>


        <!-- Gender -->
        <div class="form-group">
          <label>Gender</label>

          <select
            [(ngModel)]="user.gender"
            [disabled]="!isEditing">

            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>

          </select>
        </div>

      </div>

    </div>


    <!-- Profile Actions -->
    <div
      class="profile-actions"
      *ngIf="isEditing">

      <button
        class="cancel-btn"
        (click)="cancelEdit()">
        Cancel
      </button>

      <button
        class="save-btn"
        (click)="saveProfile()">
        <i class="fa-solid fa-check"></i>
        Save Changes
      </button>

    </div>

  </div>


  <!-- =========================
       SECURITY
  ========================== -->

  <div class="profile-card security-card">

    <div class="security-header">

      <div class="security-icon">
        <i class="fa-solid fa-lock"></i>
      </div>

      <div>
        <h3>Security</h3>
        <p>Manage your account password</p>
      </div>

    </div>


    <!-- Change Password Row -->

    <div class="security-row">

      <div>
        <h4>Change Password</h4>
        <p>Update your FinanceFlow account password</p>
      </div>

      <button
        class="outline-btn"
        *ngIf="!showPasswordSection"
        (click)="openPasswordSection()">
        Change Password
      </button>

    </div>


    <!-- Password Form -->

    <div
      class="password-form"
      *ngIf="showPasswordSection">

      <div class="form-grid">

        <!-- Current Password -->
        <div class="form-group">
          <label>Current Password</label>

          <input
            type="password"
            [(ngModel)]="currentPassword"
            placeholder="Enter current password">
        </div>


        <!-- New Password -->
        <div class="form-group">
          <label>New Password</label>

          <input
            type="password"
            [(ngModel)]="newPassword"
            placeholder="Enter new password">
        </div>


        <!-- Confirm Password -->
        <div class="form-group">
          <label>Confirm New Password</label>

          <input
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm new password">
        </div>

      </div>


      <!-- Password Actions -->

      <div class="password-actions">

        <button
          class="cancel-btn"
          (click)="cancelPasswordChange()">
          Cancel
        </button>

        <button
          class="save-btn"
          (click)="changePassword()">
          <i class="fa-solid fa-lock"></i>
          Change Password
        </button>

      </div>

    </div>

  </div>

</div>
